notes:
  - Diverse 100-rock low-poly natural rock asset pack for Life Engine 3D.
  - Spans 10 cm pebbles to 5 m landmark boulders with 10 shape families.
  - Triangle budget strictly scales with physical dimension from max 10 to max 300.
  - All assets have bottom-center origin at Z=0.
