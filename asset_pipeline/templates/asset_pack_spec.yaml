# Life Engine 3D asset-pack specification template
#
# Keep substantive asset descriptions, visual requirements, construction notes,
# measurements requiring explanation, and reference images in the task prompt.
# This file is the machine-readable execution/validation template.

pack:
  id: <pack_id>
  display_name: <Pack Name>
  category: <environment/props/etc>

source_strategy:
  default: <generate|model_from_reference|source_existing|source_and_modify|hybrid>
  evaluate_existing_models: true
  provenance_required: true

source:
  blend_path: <ArtSource/category/pack/source/pack.blend>
  collection: <Collection_Name>
  one_blend_per_pack: true

units: meters

defaults:
  exact_dimension_tolerance_m: 0.001
  origin_tolerance_m: 0.0001
  preferred_max_triangles: <number>
  hard_max_triangles: <number>
  origin: <bottom_center|center|custom>
  rotation: [0, 0, 0]
  scale: [1, 1, 1]
  uv_required: true
  material_required: true

assets:
  - id: <asset_01>
    seed: <integer|null>
    generation_mode: <generate|model_from_reference|source_existing|source_and_modify|hybrid>
    dimensions_m: [<x>, <y>, <z>]
    preferred_max_triangles: <number>
    hard_max_triangles: <number>
    material_id: <shared_material_id|null>
    provenance: null

  - id: <asset_02>
    seed: <integer|null>
    generation_mode: <generate|model_from_reference|source_existing|source_and_modify|hybrid>
    dimensions_m: [<x>, <y>, <z>]
    preferred_max_triangles: <number>
    hard_max_triangles: <number>
    material_id: <shared_material_id|null>
    provenance: null

inspection:
  layout: <grid|linear|custom>
  individual_previews: true
  overview_preview: true

export:
  format: glb
  individual_assets: true
  output_directory: <Assets/Art/category/pack/Models>
  export_at_world_origin: true

validation:
  clean_reimport: true
  json_report: <path>
  markdown_report: <path>

notes:
  - <optional structured-run exception or override; keep descriptive brief in prompt>
